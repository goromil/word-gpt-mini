[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wordgpt"
version = "0.1.0"
description = "Word-level GPT training toolkit"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "numpy",
    "lxml",
    "requests",
    "urllib3",
]

[project.scripts]
gpt_nipc_train = "wordgpt.noipc_ddp_train:run"
gpt_ipc_train = "wordgpt.ipc_ddp_train:run"
gpt_train = "wordgpt.gpt_train:train"
gpt_dataset_dl = "wordgpt.dataset_dl:main"
gpt_dataset_cumulative_dl = "wordgpt.dataset_cumulative_dl:main"
gpt_dataset_builder = "wordgpt.dataset_builder:cli"
gpt_info = "wordgpt.gpt_info:main"
gpt_setup_config = "wordgpt.config:_cli_setup"

[tool.setuptools.packages.find]
where = ["src"]
